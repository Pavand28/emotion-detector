[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
fail_under = 95

[flake8]
max-line-length = 100
exclude = .git,__pycache__,venv,.venv

[pylint]
load-plugins = pylint.extensions.mccabe
max-line-length = 100
disable = too-few-public-methods,too-many-instance-attributes
